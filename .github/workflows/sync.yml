# Keeps the internship catalog fresh.
#
# Every 4 hours: fetch every feed and a rotating slice of company boards,
# reconcile which listings are still open (delistings, passed deadlines, stale
# postings), merge duplicates, and link-check the least-recently-verified
# listings so dead application links get closed.
#
# Requires one repository secret:
#   SUPABASE_DB_URL — the Supabase Postgres connection string
#     (Supabase Dashboard → Connect → Session pooler, port 5432)

name: Sync internship catalog

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
    inputs:
      max_boards:
        description: 'Company boards to touch this run'
        default: '400'
      verify:
        description: 'Listings to link-check afterwards'
        default: '500'

concurrency:
  group: catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sync sources into Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          npm run sync -- \
            --max-boards "${{ github.event.inputs.max_boards || '400' }}" \
            --concurrency 10 \
            --verify "${{ github.event.inputs.verify || '500' }}"
