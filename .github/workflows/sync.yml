# Keeps the internship catalog fresh.
#
# Every 2 hours: fetch every feed and a rotating slice of company boards,
# reconcile which listings are still open (delistings, passed deadlines, stale
# postings), merge duplicates, and link-check the least-recently-verified
# listings so dead application links get closed.
#
# The catalog tracks several thousand employer boards, so no single run touches
# them all. Boards are picked least-recently-synced first and round-robin across
# providers, which walks the whole set roughly every day and a half.
#
# Requires one repository secret:
#   SUPABASE_DB_URL is the Supabase Postgres connection string
#     (Supabase Dashboard → Connect → Transaction pooler, port 6543)

name: Sync internship catalog

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      max_boards:
        description: 'Company boards to touch this run'
        default: '900'
      verify:
        description: 'Listings to link-check afterwards'
        default: '500'
      kinds:
        description: 'Restrict to these source kinds (comma separated, blank for all)'
        default: ''

concurrency:
  group: catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sync sources into Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          # Read through the environment rather than interpolated into the
          # script, so a dispatch input can never become shell syntax.
          MAX_BOARDS: ${{ inputs.max_boards || '900' }}
          VERIFY: ${{ inputs.verify || '500' }}
          KINDS: ${{ inputs.kinds }}
        run: |
          npm run sync -- \
            --max-boards "$MAX_BOARDS" \
            --concurrency 14 \
            ${KINDS:+--kinds "$KINDS"} \
            --verify "$VERIFY"
